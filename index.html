<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>display area</title>
    <link rel="stylesheet" href="calcuator.css" />
  </head>
  <body>
    <div class="calcuator">
      <input
        type="text"
        name="display"
        class="display"
        placeholder="0"
        disabled
      />

      <div class="buttons">
        <input type="button" class="clear-All" value="CA" id="clear" />
        <input type="button" class="Delete-All" value="DE" id="Delete" />

        <input type="button" class="operator" value="/" id="operator5" />
        <input type="button" class="operator" value="*" id="operator4" />
        <input type="button" class="num" value="7" />
        <input type="button" class="num" value="8" />
        <input type="button" class="num" value="9" />
        <input type="button" class="operator" value="-" id="operator3" />

        <input type="button" class="num" value="4" />
        <input type="button" class="num" value="5" />
        <input type="button" class="num" value="6" />
        <input type="button" class="operator" value="+" id="operator2" />

        <input type="button" class="num" value="1" />
        <input type="button" class="num" value="2" />
        <input type="button" class="num" value="3" />

        <input class="euqal" type="button" value="=" id="euqal1" />
        <input type="button" value="0" class="num Zero" />
        <input type="button" class="num" value="." />
      </div>
    </div>

    <script src="calcuator.js"></script>
  </body>
</html>
